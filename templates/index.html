<!DOCTYPE html>
<html>

<head>

<title>Descobre a Palavra</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #121213;

    color: white;

    font-family: Arial, Helvetica, sans-serif;

    text-align: center;

}


h1 {

    margin-top: 25px;

    font-size: 36px;

    font-weight: bold;

    letter-spacing: 3px;

    border-bottom: 1px solid #3a3a3c;

    padding-bottom: 20px;

}


/* TABULEIRO */

.tabuleiro {

    margin-top: 30px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 7px;

}


.linha {

    display: flex;

    gap: 7px;

}


.quadrado {

    width: 62px;

    height: 62px;

    border: 2px solid #3a3a3c;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 38px;

    font-weight: bold;

    text-transform: uppercase;

}


.verde {

    background: #538d4e;

    border-color: #538d4e;

}


.amarelo {

    background: #b59f3b;

    border-color: #b59f3b;

}


.cinza {

    background: #3a3a3c;

    border-color: #3a3a3c;

}


/* INPUT */

input {

    margin-top: 25px;

    width: 220px;

    height: 45px;

    background: #121213;

    color: white;

    border: 2px solid #3a3a3c;

    border-radius: 5px;

    font-size: 28px;

    text-align: center;

    text-transform: uppercase;

    outline: none;

}


input:focus {

    border-color: white;

}


/* BOTÕES */

form button {

    background: #538d4e;

    color: white;

    border: none;

    border-radius: 5px;

    padding: 12px 35px;

    font-size: 18px;

    font-weight: bold;

    margin-top: 15px;

    cursor: pointer;

}


form button:hover {

    background: #6aaa64;

}


/* TECLADO */

.teclado {

    margin-top: 30px;

}


.teclado div {

    margin-bottom: 8px;

}


.teclado button {

    background: #818384;

    color: white;

    border: 0;

    border-radius: 5px;

    height: 55px;

    min-width: 42px;

    margin: 3px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.teclado button.verde {

    background: #538d4e;

}


.teclado button.amarelo {

    background: #b59f3b;

}


.teclado button.cinza {

    background: #3a3a3c;

}


.teclado button:hover {

    opacity: 0.8;

}


.grande {

    min-width: 75px !important;

}


.novo {

    background: #b59f3b;

}


.novo:hover {

    background: #d0b84b;

}


footer {

    position: fixed;

    bottom: 10px;

    right: 15px;

    font-size: 12px;

    color: #888;

}


@media(max-width:500px){


.quadrado {

    width: 55px;

    height: 55px;

    font-size: 32px;

}


.teclado button {

    height: 48px;

    min-width: 32px;

    margin: 2px;

}


}

</style>


</head>


<body>


<h1>DESCOBRE A PALAVRA</h1>


<div class="tabuleiro">


{% for linha in tentativas %}


<div class="linha">


{% for letra, cor in linha %}


<div class="quadrado {{cor}}">

{{letra}}

</div>


{% endfor %}


</div>


{% endfor %}


</div>


<h2>{{ mensagem }}</h2>


{% if "Parabéns" in mensagem or "Fim do jogo" in mensagem %}


<form method="POST">

<button
class="novo"
name="novo_jogo"
value="1">

NOVO JOGO

</button>

</form>


{% else %}


<form method="POST">


<input

id="entrada"

name="palavra"

maxlength="5"

autocomplete="off"

placeholder="PALAVRA"

>


<br>


<button>

ENVIAR

</button>


</form>


{% endif %}

<div class="teclado">


<div>

<button type="button" class="{{ teclado.get('Q','') }}" onclick="letra('Q')">Q</button>
<button type="button" class="{{ teclado.get('W','') }}" onclick="letra('W')">W</button>
<button type="button" class="{{ teclado.get('E','') }}" onclick="letra('E')">E</button>
<button type="button" class="{{ teclado.get('R','') }}" onclick="letra('R')">R</button>
<button type="button" class="{{ teclado.get('T','') }}" onclick="letra('T')">T</button>
<button type="button" class="{{ teclado.get('Y','') }}" onclick="letra('Y')">Y</button>
<button type="button" class="{{ teclado.get('U','') }}" onclick="letra('U')">U</button>
<button type="button" class="{{ teclado.get('I','') }}" onclick="letra('I')">I</button>
<button type="button" class="{{ teclado.get('O','') }}" onclick="letra('O')">O</button>
<button type="button" class="{{ teclado.get('P','') }}" onclick="letra('P')">P</button>

</div>



<div>

<button type="button" class="{{ teclado.get('A','') }}" onclick="letra('A')">A</button>
<button type="button" class="{{ teclado.get('S','') }}" onclick="letra('S')">S</button>
<button type="button" class="{{ teclado.get('D','') }}" onclick="letra('D')">D</button>
<button type="button" class="{{ teclado.get('F','') }}" onclick="letra('F')">F</button>
<button type="button" class="{{ teclado.get('G','') }}" onclick="letra('G')">G</button>
<button type="button" class="{{ teclado.get('H','') }}" onclick="letra('H')">H</button>
<button type="button" class="{{ teclado.get('J','') }}" onclick="letra('J')">J</button>
<button type="button" class="{{ teclado.get('K','') }}" onclick="letra('K')">K</button>
<button type="button" class="{{ teclado.get('L','') }}" onclick="letra('L')">L</button>

</div>



<div>


<button
type="button"
class="grande"
onclick="apagar()">

⌫

</button>


<button type="button" class="{{ teclado.get('Z','') }}" onclick="letra('Z')">Z</button>
<button type="button" class="{{ teclado.get('X','') }}" onclick="letra('X')">X</button>
<button type="button" class="{{ teclado.get('C','') }}" onclick="letra('C')">C</button>
<button type="button" class="{{ teclado.get('V','') }}" onclick="letra('V')">V</button>
<button type="button" class="{{ teclado.get('B','') }}" onclick="letra('B')">B</button>
<button type="button" class="{{ teclado.get('N','') }}" onclick="letra('N')">N</button>
<button type="button" class="{{ teclado.get('M','') }}" onclick="letra('M')">M</button>


</div>


</div>




<script>


let atual = "";



function letra(l){


    if(atual.length < 5){


        atual += l;


        document.querySelector("#entrada").value = atual;


    }


}




function apagar(){


    atual = atual.slice(0,-1);



    document.querySelector("#entrada").value = atual;


}




window.onload = function(){


    let caixa = document.querySelector("#entrada");


    if(caixa){

        caixa.focus();

    }


};


</script>



<footer>

© 2026 Diogo Marques. Todos os direitos reservados.

</footer>


</body>

</html>
